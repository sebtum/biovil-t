name: biovil-t-env
channels:
  - pytorch           # offizieller Channel für PyTorch-Pakete
  - conda-forge       # Community-Channel mit vielen ML-Bibliotheken
  - defaults
dependencies:
  - python=3.9        # empfohlen für Kompatibilität mit HF Transformers und PyTorch
  - cudatoolkit=11.3  # passende CUDA-Version für GPU-Beschleunigung (optional)
  - pytorch           # PyTorch-Core-Paket (wird entsprechend cudatoolkit ausgewählt)
  - torchvision       # zusätzliche Bildverarbeitungs-Utilities zu PyTorch
  - pip               # Zugriff auf pip-Installation für HF-spezifische Pakete

  - pip:
      - transformers    # Hugging Face Transformers Library
      - accelerate      # Optimierungstools für verteiltes Training
      - pillow          # Python Imaging Library (PIL-Fork)
      - timm            # Bildklassifizierungsmodelle und Utilities
      - datasets        # HF-Datasets für Datensätze wie MIMIC-CXR
      - safetensors     # schnelleres, sicheres Serialisieren von Tensoren